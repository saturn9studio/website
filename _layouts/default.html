<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | Saturn9{% else %}Saturn9{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
    <script>try { var t = localStorage.getItem('s9-theme'); if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="icon" type="image/svg+xml" href="/static/img/s9.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,400&display=swap">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}

    <main id="main">
{{ content }}
    </main>

    {% include footer.html %}
    <script src="/static/js/theme.js" defer></script>
    {% for script in page.scripts %}
    <script src="{{ script }}" defer></script>
    {% endfor %}
</body>
</html>
